<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Dating - Conoce Gente Nueva</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🔥</span>
                <h1>Hot Dating</h1>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="openProfile()">👤</button>
                <button class="btn-icon" onclick="openMessages()">💬</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Cards View -->
            <div id="cardsView" class="view active">
                <div class="cards-container">
                    <div id="cardsStack" class="cards-stack"></div>
                    
                    <!-- Buttons -->
                    <div class="action-buttons">
                        <button class="btn-action btn-reject" onclick="rejectCard()">
                            <span class="icon">✕</span>
                            <span>Pasar</span>
                        </button>
                        <button class="btn-action btn-superlike" onclick="superlikeCard()">
                            <span class="icon">⭐</span>
                            <span>Super</span>
                        </button>
                        <button class="btn-action btn-like" onclick="likeCard()">
                            <span class="icon">❤️</span>
                            <span>Like</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Matches View -->
            <div id="matchesView" class="view">
                <div class="matches-container">
                    <h2>Tus Matches</h2>
                    <div id="matchesList" class="matches-list"></div>
                </div>
            </div>

            <!-- Profile View -->
            <div id="profileView" class="view">
                <div class="profile-container">
                    <button class="btn-back" onclick="backToCards()">← Volver</button>
                    <div id="profileContent"></div>
                </div>
            </div>

            <!-- Messages View -->
            <div id="messagesView" class="view">
                <div class="messages-container">
                    <button class="btn-back" onclick="backToCards()">← Volver</button>
                    <div id="messagesList" class="messages-list"></div>
                </div>
            </div>
        </main>

        <!-- Navigation -->
        <nav class="navigation">
            <button class="nav-btn" onclick="showView('cardsView')" data-view="cardsView">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">Descubrir</span>
            </button>
            <button class="nav-btn" onclick="showView('matchesView')" data-view="matchesView">
                <span class="nav-icon">💕</span>
                <span class="nav-label">Matches</span>
            </button>
            <button class="nav-btn" onclick="showView('profileView')" data-view="profileView">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Perfil</span>
            </button>
        </nav>
    </div>

    <!-- Match Modal -->
    <div id="matchModal" class="modal hidden">
        <div class="modal-content match-modal">
            <div class="match-header">¡ES UN MATCH! 💕</div>
            <div class="match-avatars">
                <img id="matchImg1" src="" alt="Tu foto">
                <span class="match-heart">💕</span>
                <img id="matchImg2" src="" alt="Su foto">
            </div>
            <h2 id="matchName"></h2>
            <button class="btn-primary" onclick="startChat()">Enviar Mensaje</button>
            <button class="btn-secondary" onclick="closeModal()">Continuar</button>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="modal hidden">
        <div class="modal-content chat-modal">
            <div class="chat-header">
                <button class="btn-back" onclick="closeChat()">←</button>
                <div class="chat-info">
                    <img id="chatAvatar" src="" alt="Avatar">
                    <div>
                        <h3 id="chatName"></h3>
                        <span class="status">● En línea</span>
                    </div>
                </div>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="handleChatKey(event)">
                <button class="btn-send" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal hidden">
        <div class="modal-content profile-modal">
            <h2>Editar Perfil</h2>
            <form onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="profileName" required>
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" id="profileAge" required min="18">
                </div>
                <div class="form-group">
                    <label>Ciudad</label>
                    <input type="text" id="profileCity" required>
                </div>
                <div class="form-group">
                    <label>Foto (URL)</label>
                    <input type="text" id="profilePhoto" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="profileBio" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Guardar</button>
                    <button type="button" class="btn-secondary" onclick="closeEditProfile()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
